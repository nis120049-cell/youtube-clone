<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyTube Indonesia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <span class="logo-icon">▶</span>
        <span>MyTube</span>
    </div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Cari video..."
        >

        <button onclick="searchVideo()">🔍</button>
    </div>

</header>


<nav class="categories">
    <button>Semua</button>
    <button>Gaming</button>
    <button>Musik</button>
    <button>Anime</button>
    <button>Teknologi</button>
    <button>Indonesia</button>
</nav>


<main>

    <h2>Video Pilihan</h2>

    <section class="video-grid">

        <article class="video-card"
                 data-title="Video YouTube Indonesia">

            <div class="thumbnail">

                <img
                    src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg"
                    alt="Thumbnail video">

                <span class="duration">03:32</span>

            </div>

            <div class="video-info">

                <div class="channel-icon">
                    ▶
                </div>

                <div>

                    <h3>Video YouTube Indonesia</h3>

                    <p>MyTube Channel</p>

                    <p>1,2 jt ditonton • 2 hari lalu</p>

                </div>

            </div>

        </article>


        <article class="video-card"
                 data-title="Video Gaming Indonesia">

            <div class="thumbnail">

                <img
                    src="https://i.ytimg.com/vi/ScMzIvxBSi4/hqdefault.jpg"
                    alt="Thumbnail gaming">

                <span class="duration">05:21</span>

            </div>

            <div class="video-info">

                <div class="channel-icon">
                    🎮
                </div>

                <div>

                    <h3>Video Gaming Indonesia</h3>

                    <p>Gaming Channel</p>

                    <p>850 rb ditonton • 1 minggu lalu</p>

                </div>

            </div>

        </article>

    </section>

</main>


<nav class="bottom-nav">

    <button>🏠<span>Beranda</span></button>
    <button>🔥<span>Trending</span></button>
    <button>➕<span>Buat</span></button>
    <button>📺<span>Subscription</span></button>
    <button>👤<span>Anda</span></button>

</nav>


<script src="script.js"></script>

</body>
</html>
